<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Aura AI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e11d48;
            --primary-dark: #be123c;
            --primary-light: #fda4af;
            --bg-page: #fecdd6;
            --surface: rgba(255, 255, 255, 0.94);
            --border: rgba(225, 29, 72, 0.18);
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-card: 0 16px 40px -8px rgba(190, 18, 60, 0.22), 0 0 0 1px rgba(225, 29, 72, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: var(--bg-page);
            background-image: radial-gradient(rgba(255, 255, 255, 0.75) 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            color: var(--text-dark);
        }

        .reset-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 36px 28px;
            box-shadow: var(--shadow-card);
            animation: cardAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(18px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--primary);
            background: rgba(225, 29, 72, 0.08);
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(225, 29, 72, 0.2);
            margin-bottom: 12px;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.45;
        }

        .email-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(254, 205, 214, 0.45);
            border: 1px solid rgba(225, 29, 72, 0.2);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.84rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin: 16px 0 20px 0;
            word-break: break-all;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .password-wrapper input {
            width: 100%;
            padding: 13px 44px 13px 14px;
            font-size: 0.95rem;
            border: 1px solid rgba(225, 29, 72, 0.25);
            border-radius: var(--radius-sm);
            background: #ffffff;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
        }

        .password-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);
        }

        .eye-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            opacity: 0.65;
            transition: opacity 0.2s;
            user-select: none;
        }

        .eye-toggle:hover {
            opacity: 1;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #e11d48, #be123c);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
            margin-top: 10px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(225, 29, 72, 0.45);
        }

        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .error-box {
            background: rgba(255, 241, 242, 0.95);
            color: #be123c;
            border: 1px solid rgba(244, 63, 94, 0.35);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.84rem;
            font-weight: 600;
            line-height: 1.45;
            margin-bottom: 16px;
            display: none;
        }

        .success-box {
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .success-icon {
            font-size: 3.2rem;
            margin-bottom: 12px;
        }

        .success-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #065f46;
            margin-bottom: 8px;
        }

        .success-desc {
            font-size: 0.88rem;
            color: #047857;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .login-link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #059669, #047857);
            border-radius: var(--radius-sm);
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3);
            transition: all 0.2s ease;
        }

        .login-link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(5, 150, 105, 0.4);
        }

        .footer-note {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 20px;
        }

        .footer-note a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="reset-card" id="reset-card">
        
        <!-- HEADER -->
        <div class="brand-header">
            <div class="brand-badge">✦ Aura AI Security</div>
            <h1 class="brand-title" id="page-title">Set New Password</h1>
            <p class="brand-subtitle" id="page-subtitle">Enter your new secure password below to regain access.</p>
        </div>

        <!-- ACCOUNT PILL -->
        <div class="email-pill" id="email-pill" style="display: none;">
            <span>Account:</span>
            <strong id="user-email-text">-</strong>
        </div>

        <!-- ERROR MESSAGE BOX -->
        <div class="error-box" id="error-box"></div>

        <!-- PASSWORD RESET FORM -->
        <form id="reset-form" style="display: none;">
            <div class="input-group">
                <label for="new-password">New Password (minimum 6 characters)</label>
                <div class="password-wrapper">
                    <input type="password" id="new-password" placeholder="Enter your new password" required autocomplete="new-password">
                    <button type="button" class="eye-toggle" id="toggle-pass" title="Show / Hide Password">👁️</button>
                </div>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm-password" placeholder="Re-enter your new password" required autocomplete="new-password">
                    <button type="button" class="eye-toggle" id="toggle-confirm" title="Show / Hide Password">👁️</button>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Update Password 🔒</button>
        </form>

        <!-- SUCCESS SCREEN -->
        <div class="success-box" id="success-box">
            <div class="success-icon">🎉</div>
            <h2 class="success-title">Password Updated!</h2>
            <p class="success-desc">Your password has been changed securely. You can now log into Aura AI with your new credentials.</p>
            <a href="/" class="login-link-btn">Go to Login 👉</a>
        </div>

        <div class="footer-note">
            <span>Powered by Aura Autonomous AI &bull; <a href="/">Back to Home</a></span>
        </div>
    </div>

    <script>
        // DOM Elements
        const form = document.getElementById('reset-form');
        const newPassInput = document.getElementById('new-password');
        const confirmPassInput = document.getElementById('confirm-password');
        const togglePassBtn = document.getElementById('toggle-pass');
        const toggleConfirmBtn = document.getElementById('toggle-confirm');
        const submitBtn = document.getElementById('submit-btn');
        const errorBox = document.getElementById('error-box');
        const successBox = document.getElementById('success-box');
        const emailPill = document.getElementById('email-pill');
        const userEmailText = document.getElementById('user-email-text');
        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');

        // Extract token from URL
        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('token');

        // Check hash fallback
        if (!token && window.location.hash.includes('token=')) {
            const hashParts = window.location.hash.split('token=');
            token = hashParts[1] ? hashParts[1].split('&')[0] : null;
        }

        // Eye Toggles
        let passVisible = false;
        togglePassBtn.addEventListener('click', () => {
            passVisible = !passVisible;
            newPassInput.type = passVisible ? 'text' : 'password';
            togglePassBtn.innerText = passVisible ? '🙈' : '👁️';
        });

        let confirmVisible = false;
        toggleConfirmBtn.addEventListener('click', () => {
            confirmVisible = !confirmVisible;
            confirmPassInput.type = confirmVisible ? 'text' : 'password';
            toggleConfirmBtn.innerText = confirmVisible ? '🙈' : '👁️';
        });

        // Initialize and Verify Token on Load
        async function verifyToken() {
            if (!token) {
                showError('No reset token provided. Please click the reset link sent to your email.');
                return;
            }

            try {
                const res = await fetch(`/api/auth/verify-reset-token?token=${encodeURIComponent(token)}`);
                const data = await res.json();

                if (!res.ok || !data.valid) {
                    showError(data.error || 'This password reset link is invalid or has expired.');
                    return;
                }

                // Show Form
                form.style.display = 'block';
                emailPill.style.display = 'flex';
                userEmailText.innerText = data.email;
                newPassInput.focus();

            } catch (err) {
                console.error('Verify error:', err);
                showError('Unable to connect to server. Please ensure you are connected to the network.');
            }
        }

        function showError(msg) {
            errorBox.innerHTML = `${msg} <br><br><a href="/#forgot" style="color: #be123c; font-weight: 800; text-decoration: underline;">Request a new reset link 👉</a>`;
            errorBox.style.display = 'block';
            form.style.display = 'none';
            emailPill.style.display = 'none';
        }

        // Form Submit Handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';

            const newPassword = newPassInput.value;
            const confirmPassword = confirmPassInput.value;

            if (newPassword.length < 6) {
                errorBox.innerText = 'Password must be at least 6 characters long.';
                errorBox.style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                errorBox.innerText = 'Passwords do not match. Please verify and re-type.';
                errorBox.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Updating Password... ⏳';

            try {
                const res = await fetch('/api/auth/reset-password-confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();

                if (!res.ok) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Update Password 🔒';
                    errorBox.innerHTML = `${data.error || 'Failed to update password.'} <br><br><a href="/#forgot" style="color: #be123c; font-weight: 800; text-decoration: underline;">Request a new link 👉</a>`;
                    errorBox.style.display = 'block';
                    return;
                }

                // Show Success Screen
                form.style.display = 'none';
                emailPill.style.display = 'none';
                pageTitle.innerText = 'Success!';
                pageSubtitle.innerText = 'Your security credentials have been updated.';
                successBox.style.display = 'block';

            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Update Password 🔒';
                errorBox.innerText = 'Connection error. Please try again.';
                errorBox.style.display = 'block';
            }
        });

        // Run Verification
        verifyToken();
    </script>
</body>
</html>
